<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salat</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffb8d1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#ffe8f0;--ink:#5b3a4e;--mute:#a07b90;--card:#fff;--pink:#ffb8d1;--pinkd:#ec6a9b;--blue:#cfe8ff;--blued:#5aa9e6;--green:#d3f2d0;--greend:#4cb36b;--yellow:#fff3b8;--yellowd:#f2b600;--lilac:#ecdcff;--liliacd:#a37be0}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#ffe8f0 0%,#fff6dc 55%,#e3f6e3 100%) fixed;color:var(--ink);font-family:"Quicksand","Nunito",ui-rounded,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px 60px;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0}
.deco span{position:absolute;font-size:28px;opacity:.55;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.deco span{animation:none}}
main{max-width:480px;margin:0 auto;position:relative;z-index:1}
.title{text-align:center;font-size:30px;font-weight:700;color:var(--pinkd);margin:22px 0 2px;letter-spacing:.02em}
h1{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 10px;text-align:center}
.next,.row,.week,details,button{position:relative;z-index:1}
.next{background:var(--yellow);border:3px dashed var(--yellowd);border-radius:26px;padding:18px;margin:8px 0 18px;text-align:center}
.next small{color:var(--mute);font-weight:600}
.next b{display:block;font-size:32px;color:var(--pinkd);margin:2px 0}
.next span{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:14px;border-radius:22px;padding:12px 16px;margin-bottom:12px;cursor:pointer;border:3px solid transparent;user-select:none;transition:transform .15s;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.row:active{transform:scale(.97)}
.row:nth-child(5n+1){background:var(--pink);--d:var(--pinkd)}
.row:nth-child(5n+2){background:var(--blue);--d:var(--blued)}
.row:nth-child(5n+3){background:var(--green);--d:var(--greend)}
.row:nth-child(5n+4){background:var(--yellow);--d:var(--yellowd)}
.row:nth-child(5n+5){background:var(--lilac);--d:var(--liliacd)}
.row.done{border-color:var(--d)}
.row .n{flex:1;font-size:20px;font-weight:700}
.row .n small{display:block;color:var(--ink);opacity:.6;font-size:14px;direction:rtl;text-align:left;font-weight:600}
.row .t{font-weight:700;font-variant-numeric:tabular-nums}
.row.missed .t{color:#d9435f}
.box{width:50px;height:50px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.box svg{width:100%;height:100%;overflow:visible}
.box path{fill:#fff;stroke:var(--d);stroke-width:1.2;stroke-linejoin:round;transition:fill .3s}
.box .back path{fill:#fff;opacity:.8}
.box .vein{fill:none;stroke:var(--d);stroke-width:.8;stroke-linecap:round;opacity:.35}
.box .core{fill:#fff;stroke:var(--d);stroke-width:1.2;transition:fill .3s}
.box .dots circle{fill:var(--d);opacity:.0;transition:opacity .3s}
.row.done .box .back path{fill:color-mix(in srgb,var(--d) 40%,#fff)}
.row.done .box .front path:first-child{fill:color-mix(in srgb,var(--d) 78%,#fff)}
.row.done .box .vein{stroke:#fff;opacity:.7}
.row.done .box .core{fill:#ffd93b;stroke:#e0a100}
.row.done .box .dots circle{fill:#c47f00;opacity:.9}
.row.done .box svg{animation:bloom .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bloom{0%{transform:scale(.4) rotate(-60deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.week{display:flex;gap:6px;margin:6px 0 18px}
.week div{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mute)}
.week i{display:block;height:40px;border-radius:12px;background:#fff;margin-bottom:4px;position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--pinkd),var(--pink))}
button,input,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--pink);border-radius:16px;padding:12px 14px}
button{width:100%;background:var(--pinkd);border-color:var(--pinkd);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #c04e7c}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c04e7c}
details{background:#fff;border-radius:20px;padding:14px 16px;margin-top:14px;border:2px solid var(--blue)}
summary{cursor:pointer;color:var(--blued);font-weight:700}
label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--mute)}
details input,details select{width:100%}
#msg{font-size:14px;font-weight:600;color:var(--pinkd);margin-top:12px;min-height:18px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="deco" id="deco"></div>
  <div class="title">🌸 Salat 🌸</div>
  <h1 id="date"></h1>
  <div class="next"><small>Next prayer</small><b id="nextName">—</b><span id="nextIn"></span></div>
  <div id="list"></div>
  <h1>Last 7 days</h1>
  <div class="week" id="week"></div>
  <button id="notifBtn" hidden>Enable prayer reminders</button>
  <div id="msg"></div>
  <details>
    <summary>Settings</summary>
    <label>City</label><input id="city" value="Tunis">
    <label>Country</label><input id="country" value="Tunisia">
    <label>Calculation method</label>
    <select id="method">
      <option value="18">Tunisia (Ministry of Religious Affairs)</option>
      <option value="3">Muslim World League</option>
      <option value="2">ISNA</option>
      <option value="5">Egyptian General Authority</option>
      <option value="4">Umm al-Qura, Makkah</option>
      <option value="1">Karachi</option>
    </select>
    <label>Remind me (minutes after adhan)</label>
    <input id="offset" type="number" min="0" max="60" value="0">
    <button id="save" style="margin-top:14px">Save</button>
  </details>
</main>
<script>
const PR=[["Fajr","Sobh","الصبح"],["Dhuhr","Dhohr","الظهر"],["Asr","Asr","العصر"],["Maghrib","Maghreb","المغرب"],["Isha","Isha","العشاء"]];
const PET="M20 20C11.5 15 11 5 20 1.5C29 5 28.5 15 20 20Z";
const FLOWER=`<svg viewBox="0 0 40 40"><g class="back">${[36,108,180,252,324].map(a=>`<path d="${PET}" transform="rotate(${a} 20 20) scale(1) "/>`).join("")}</g><g class="front">${[0,72,144,216,288].map(a=>`<g transform="rotate(${a} 20 20)"><path d="${PET}"/><path class="vein" d="M20 17.5V6.5"/></g>`).join("")}</g><circle class="core" cx="20" cy="20" r="5.2"/><g class="dots">${[0,72,144,216,288].map(a=>`<circle cx="20" cy="16.6" r=".9" transform="rotate(${a} 20 20)"/>`).join("")}</g></svg>`;
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cfg=ls.get("cfg",{city:"Tunis",country:"Tunisia",method:"18",offset:0});
let times=null,timers=[];
const dkey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=d=>d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

async function loadTimes(){
  const k=dkey(),ck="times:"+k+":"+cfg.city+cfg.country+cfg.method;
  let t=ls.get(ck);
  if(!t){
    try{
      const [y,m,d]=k.split("-");
      const r=await fetch(`https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=${encodeURIComponent(cfg.city)}&country=${encodeURIComponent(cfg.country)}&method=${cfg.method}`);
      const j=await r.json();
      t={};PR.forEach(p=>t[p[0]]=j.data.timings[p[0]].slice(0,5));
      ls.set(ck,t);
    }catch{ $("#msg").textContent="Offline — couldn't fetch today's times."; return null }
  }
  return PR.map(p=>{const [h,m]=t[p[0]].split(":");const d=new Date();d.setHours(+h,+m+(+cfg.offset||0),0,0);return {id:p[0],name:p[1],ar:p[2],at:d,raw:t[p[0]]}});
}

function state(){return ls.get("log:"+dkey(),{})}
function toggle(id){const s=state();s[id]=!s[id];ls.set("log:"+dkey(),s);render()}

(function(){const f=["🌸","🌼","🌷","🌻","💮","🌺"];const d=document.getElementById("deco");
for(let i=0;i<14;i++){const e=document.createElement("span");e.textContent=f[i%f.length];e.style.left=(Math.random()*92)+"%";e.style.top=(Math.random()*92)+"%";e.style.fontSize=(20+Math.random()*22)+"px";e.style.animationDelay=(-Math.random()*6)+"s";d.appendChild(e)}})();
function render(){
  $("#date").textContent=new Date().toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"});
  const s=state(),now=new Date();
  $("#list").innerHTML="";
  (times||PR.map(p=>({id:p[0],name:p[1],ar:p[2],at:null}))).forEach(p=>{
    const el=document.createElement("div");
    el.className="row"+(s[p.id]?" done":"")+(!s[p.id]&&p.at&&p.at<now-1000*60*90?" missed":"");
    el.innerHTML=`<div class="box">${FLOWER}</div><div class="n">${p.name}<small>${p.ar}</small></div><div class="t">${p.at?fmt(p.at):"--:--"}</div>`;
    el.onclick=()=>toggle(p.id);
    $("#list").appendChild(el);
  });
  const w=$("#week");w.innerHTML="";
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const l=ls.get("log:"+dkey(d),{});const c=PR.filter(p=>l[p[0]]).length;
    const c2=document.createElement("div");
    c2.innerHTML=`<i><b style="height:${c*20}%"></b></i>${d.toLocaleDateString([],{weekday:"narrow"})} · ${c}`;
    w.appendChild(c2);
  }
  const all=PR.every(p=>s[p[0]]);
  if(all)$("#msg").textContent="Mashallah, all 5 prayers done today! 🌼🌸🌷";
  else if($("#msg").textContent.startsWith("Mashallah"))$("#msg").textContent="";
  tick();
}

function tick(){
  if(!times)return;
  const now=new Date(),nx=times.find(p=>p.at>now);
  if(nx){const m=Math.round((nx.at-now)/60000);$("#nextName").textContent=nx.name;$("#nextIn").textContent=`at ${fmt(nx.at)} · in ${Math.floor(m/60)}h ${m%60}min`}
  else{$("#nextName").textContent="All done for today";$("#nextIn").textContent="Fajr again tomorrow"}
}

async function notify(p){
  if(Notification.permission!=="granted")return;
  const nk="notified:"+dkey()+p.id;if(ls.get(nk))return;ls.set(nk,1);
  if(state()[p.id])return;
  const reg=await navigator.serviceWorker.getRegistration();
  const opts={body:"Time to pray "+p.name+" · "+p.ar,tag:"salat-"+p.id,icon:"icon-192.png",badge:"icon-192.png",requireInteraction:true,vibrate:[200,100,200]};
  reg?reg.showNotification("🌸 "+p.name,opts):new Notification("🌸 "+p.name,opts);
}

function schedule(){
  timers.forEach(clearTimeout);timers=[];
  if(!times)return;
  const now=new Date();
  times.forEach(p=>{
    const ms=p.at-now;
    if(ms>0&&ms<864e5)timers.push(setTimeout(()=>notify(p),ms));
    else if(ms<=0&&ms>-5*60000)notify(p);
  });
}

async function boot(){
  times=await loadTimes();render();schedule();
}

function updateBtn(){
  const b=$("#notifBtn");
  if(!("Notification" in window)){b.hidden=true;$("#msg").textContent="Notifications aren't supported in this browser.";return}
  b.hidden=Notification.permission==="granted";
  if(Notification.permission==="denied"){b.hidden=true;$("#msg").textContent="Notifications are blocked — allow them in your browser/site settings."}
}
$("#notifBtn").onclick=async()=>{await Notification.requestPermission();updateBtn();schedule()};

$("#city").value=cfg.city;$("#country").value=cfg.country;$("#method").value=cfg.method;$("#offset").value=cfg.offset;
$("#save").onclick=()=>{cfg={city:$("#city").value.trim()||"Tunis",country:$("#country").value.trim()||"Tunisia",method:$("#method").value,offset:+$("#offset").value||0};ls.set("cfg",cfg);boot()};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(dkey()!==ls.get("lastday"))ls.set("lastday",dkey());boot()}});
setInterval(()=>{tick();if(times)times.forEach(p=>{const ms=p.at-new Date();if(ms<=0&&ms>-90000)notify(p)})},20000);
updateBtn();boot();
</script>
</body>
</html>
