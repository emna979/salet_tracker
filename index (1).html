<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salat</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d3e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f3d3e;--card:#16494a;--ink:#f4efe3;--mute:#9db9b5;--gold:#e2b857;--ok:#6fcf97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px 40px}
main{max-width:480px;margin:0 auto}
h1{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:20px 0 4px}
.next{background:var(--card);border-radius:20px;padding:20px;margin:8px 0 16px;text-align:center}
.next small{color:var(--mute)}
.next b{display:block;font-size:30px;color:var(--gold);margin:4px 0}
.next span{font-size:15px;color:var(--ink)}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;user-select:none}
.row.done{border-color:var(--ok)}
.row .n{flex:1;font-size:18px}
.row .n small{display:block;color:var(--mute);font-size:13px;direction:rtl;text-align:left}
.row .t{color:var(--mute);font-variant-numeric:tabular-nums}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-size:18px;color:transparent}
.row.done .box{background:var(--ok);border-color:var(--ok);color:#0f3d3e}
.row.missed .t{color:#e57373}
.week{display:flex;gap:6px;margin:6px 0 16px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.week i{display:block;height:34px;border-radius:8px;background:var(--card);margin-bottom:4px;position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:var(--ok)}
button,input,select{font:inherit;color:var(--ink);background:var(--card);border:0;border-radius:12px;padding:12px 14px}
button{width:100%;background:var(--gold);color:#0f3d3e;font-weight:600;cursor:pointer}
details{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:14px}
summary{cursor:pointer;color:var(--mute)}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mute)}
details input,details select{width:100%;background:#0f3d3e}
#msg{font-size:13px;color:var(--mute);margin-top:10px;min-height:18px;text-align:center}
</style>
</head>
<body>
<main>
  <h1 id="date"></h1>
  <div class="next"><small>Next prayer</small><b id="nextName">—</b><span id="nextIn"></span></div>
  <div id="list"></div>
  <h1>Last 7 days</h1>
  <div class="week" id="week"></div>
  <button id="notifBtn" hidden>Enable prayer reminders</button>
  <div id="msg"></div>
  <details>
    <summary>Settings</summary>
    <label>City</label><input id="city" value="Tunis">
    <label>Country</label><input id="country" value="Tunisia">
    <label>Calculation method</label>
    <select id="method">
      <option value="18">Tunisia (Ministry of Religious Affairs)</option>
      <option value="3">Muslim World League</option>
      <option value="2">ISNA</option>
      <option value="5">Egyptian General Authority</option>
      <option value="4">Umm al-Qura, Makkah</option>
      <option value="1">Karachi</option>
    </select>
    <label>Remind me (minutes after adhan)</label>
    <input id="offset" type="number" min="0" max="60" value="0">
    <button id="save" style="margin-top:14px">Save</button>
  </details>
</main>
<script>
const PR=[["Fajr","Sobh","الصبح"],["Dhuhr","Dhohr","الظهر"],["Asr","Asr","العصر"],["Maghrib","Maghreb","المغرب"],["Isha","Isha","العشاء"]];
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cfg=ls.get("cfg",{city:"Tunis",country:"Tunisia",method:"18",offset:0});
let times=null,timers=[];
const dkey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=d=>d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

async function loadTimes(){
  const k=dkey(),ck="times:"+k+":"+cfg.city+cfg.country+cfg.method;
  let t=ls.get(ck);
  if(!t){
    try{
      const [y,m,d]=k.split("-");
      const r=await fetch(`https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=${encodeURIComponent(cfg.city)}&country=${encodeURIComponent(cfg.country)}&method=${cfg.method}`);
      const j=await r.json();
      t={};PR.forEach(p=>t[p[0]]=j.data.timings[p[0]].slice(0,5));
      ls.set(ck,t);
    }catch{ $("#msg").textContent="Offline — couldn't fetch today's times."; return null }
  }
  return PR.map(p=>{const [h,m]=t[p[0]].split(":");const d=new Date();d.setHours(+h,+m+(+cfg.offset||0),0,0);return {id:p[0],name:p[1],ar:p[2],at:d,raw:t[p[0]]}});
}

function state(){return ls.get("log:"+dkey(),{})}
function toggle(id){const s=state();s[id]=!s[id];ls.set("log:"+dkey(),s);render()}

function render(){
  $("#date").textContent=new Date().toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"});
  const s=state(),now=new Date();
  $("#list").innerHTML="";
  (times||PR.map(p=>({id:p[0],name:p[1],ar:p[2],at:null}))).forEach(p=>{
    const el=document.createElement("div");
    el.className="row"+(s[p.id]?" done":"")+(!s[p.id]&&p.at&&p.at<now-1000*60*90?" missed":"");
    el.innerHTML=`<div class="box">✓</div><div class="n">${p.name}<small>${p.ar}</small></div><div class="t">${p.at?fmt(p.at):"--:--"}</div>`;
    el.onclick=()=>toggle(p.id);
    $("#list").appendChild(el);
  });
  const w=$("#week");w.innerHTML="";
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const l=ls.get("log:"+dkey(d),{});const c=PR.filter(p=>l[p[0]]).length;
    const c2=document.createElement("div");
    c2.innerHTML=`<i><b style="height:${c*20}%"></b></i>${d.toLocaleDateString([],{weekday:"narrow"})} · ${c}`;
    w.appendChild(c2);
  }
  tick();
}

function tick(){
  if(!times)return;
  const now=new Date(),nx=times.find(p=>p.at>now);
  if(nx){const m=Math.round((nx.at-now)/60000);$("#nextName").textContent=nx.name;$("#nextIn").textContent=`at ${fmt(nx.at)} · in ${Math.floor(m/60)}h ${m%60}min`}
  else{$("#nextName").textContent="All done for today";$("#nextIn").textContent="Fajr again tomorrow"}
}

async function notify(p){
  if(Notification.permission!=="granted")return;
  const nk="notified:"+dkey()+p.id;if(ls.get(nk))return;ls.set(nk,1);
  if(state()[p.id])return;
  const reg=await navigator.serviceWorker.getRegistration();
  const opts={body:"Time to pray "+p.name+" · "+p.ar,tag:"salat-"+p.id,icon:"icon-192.png",badge:"icon-192.png",requireInteraction:true,vibrate:[200,100,200]};
  reg?reg.showNotification("🕌 "+p.name,opts):new Notification("🕌 "+p.name,opts);
}

function schedule(){
  timers.forEach(clearTimeout);timers=[];
  if(!times)return;
  const now=new Date();
  times.forEach(p=>{
    const ms=p.at-now;
    if(ms>0&&ms<864e5)timers.push(setTimeout(()=>notify(p),ms));
    else if(ms<=0&&ms>-5*60000)notify(p);
  });
}

async function boot(){
  times=await loadTimes();render();schedule();
}

function updateBtn(){
  const b=$("#notifBtn");
  if(!("Notification" in window)){b.hidden=true;$("#msg").textContent="Notifications aren't supported in this browser.";return}
  b.hidden=Notification.permission==="granted";
  if(Notification.permission==="denied"){b.hidden=true;$("#msg").textContent="Notifications are blocked — allow them in your browser/site settings."}
}
$("#notifBtn").onclick=async()=>{await Notification.requestPermission();updateBtn();schedule()};

$("#city").value=cfg.city;$("#country").value=cfg.country;$("#method").value=cfg.method;$("#offset").value=cfg.offset;
$("#save").onclick=()=>{cfg={city:$("#city").value.trim()||"Tunis",country:$("#country").value.trim()||"Tunisia",method:$("#method").value,offset:+$("#offset").value||0};ls.set("cfg",cfg);boot()};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(dkey()!==ls.get("lastday"))ls.set("lastday",dkey());boot()}});
setInterval(()=>{tick();if(times)times.forEach(p=>{const ms=p.at-new Date();if(ms<=0&&ms>-90000)notify(p)})},20000);
updateBtn();boot();
</script>
</body>
</html>
